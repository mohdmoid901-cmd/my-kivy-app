name: Final Core Fix Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup System Architecture Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev liblzma-dev libltdl-dev bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev m4 patchelf
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.33 virtualenv
      - name: Compile APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          export P4A_ALLOW_ROOT=1
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android debug || true
      - name: Universal APK Upload
        uses: actions/upload-artifact@v4
        with:
          name: my-kivy-app-apk
          path: "**/*.apk"
# exact core alignment trigger
