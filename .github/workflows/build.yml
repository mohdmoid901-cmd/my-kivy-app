name: Full Automatic Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Automatic System Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libreadline-dev libsqlite3-dev libssl-dev libgdbm-dev libffi-dev liblzma-dev tk-dev libspatialindex-dev libltdl-dev bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev m4
          pip3 install --upgrade pip
          pip3 install buildozer cython virtualenv
      - name: Automatic APK Build
        run: |
          buildozer android debug
# auto build trigger
